[package]
name = "aiken-jna-wrapper"
version = "0.7.0"
edition = "2021"
authors = ["satran004", "matiwinnetou"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib"]

[dependencies]
# Pinned to exact versions and kept in lockstep with the pallas line they
# require: uplc/aiken-lang 1.1.22 depend on pallas ^0.35, so the pallas pins
# below must stay on 0.35.x. Mixing lines makes `uplc::tx::eval_phase_two`
# fail to compile with mismatched pallas types.
uplc = "=1.1.22"
aiken-lang = "=1.1.22"

pallas-addresses = "0.35.1"
pallas-codec = { version = "0.35.1", features = ["num-bigint"] }
pallas-crypto = "0.35.1"
pallas-primitives = "0.35.1"
pallas-traverse = "0.35.1"

hex = "0.4.3"

# Kept on the 0.25 line: pallas-codec pins minicbor ^0.25, and transaction.rs
# encodes pallas types whose Encode impls come from that same minicbor. A 2.x
# bump would mismatch those trait impls and break redeemer CBOR encoding.
minicbor = "0.25.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150" }
anyhow = "1.0.102"
