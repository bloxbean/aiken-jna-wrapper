[package]
name = "aiken-jna-wrapper"
version = "0.8.0"
edition = "2021"
authors = ["satran004", "matiwinnetou"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib"]

[dependencies]
# uplc requires pallas ^0.35, so the pallas crates below are pinned to 0.35.x to
# match; mixing pallas lines breaks eval_phase_two compilation.
uplc = "=1.1.22"

pallas-addresses = "0.35.1"
pallas-codec = { version = "0.35.1", features = ["num-bigint"] }
pallas-crypto = "0.35.1"
pallas-primitives = "0.35.1"
pallas-traverse = "0.35.1"

hex = "0.4.3"

# Pinned to 0.25 to match pallas-codec's minicbor ^0.25 (shared Encode impls).
minicbor = "0.25.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150" }
anyhow = "1.0.102"
